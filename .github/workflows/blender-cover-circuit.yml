name: Build Arena C Mixed Airsoft Cover in Blender
on:
  push:
    branches: [arena-v3-cover-circuit]
    paths:
      - 'art/build_cover_circuit.py'
      - 'shared/arena-layout.json'
      - '.github/workflows/blender-arena-v2.yml'
permissions:
  contents: write
jobs:
  blender-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender plus glTF texture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Add detailed airsoft cover to existing Blender warehouse
        run: |
          blender --background --python art/build_cover_circuit.py > /tmp/arena-v2.log 2>&1 || { tail -130 /tmp/arena-v2.log; exit 1; }
          tail -14 /tmp/arena-v2.log
          grep COVER_CIRCUIT_C_BUILD_SUCCESS /tmp/arena-v2.log
          test -s art/the_arena_v2.blend
          test -s client/public/assets/arena.glb
          ls -lh art/the_arena_v2.blend client/public/assets/arena.glb
      - name: Commit source Blender project and game-ready GLB
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/the_arena_v2.blend client/public/assets/arena.glb
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Arena C realistic tournament barricades and inflatable cover in Blender'
            git fetch origin arena-v3-cover-circuit
            git rebase origin/arena-v3-cover-circuit
            git push origin HEAD:arena-v3-cover-circuit
          fi
