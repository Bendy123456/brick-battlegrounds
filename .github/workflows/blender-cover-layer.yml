name: Build Separate C-Cover Blender GLB Layer
on:
  push:
    branches: [arena-v3-cover-layer]
    paths:
      - 'art/build_cover_layer.py'
      - 'art/build_arena_v2.py'
      - 'shared/arena-layout.json'
      - '.github/workflows/blender-cover-layer.yml'
permissions:
  contents: write
jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build 82 detailed plywood and inflatable cover models only
        run: |
          blender --background --python art/build_cover_layer.py > /tmp/airsoft-cover.log 2>&1 || { tail -140 /tmp/airsoft-cover.log; exit 1; }
          grep COVER_LAYER_SOURCE_VALID /tmp/airsoft-cover.log
          grep THE_ARENA_V2_BUILD_SUCCESS /tmp/airsoft-cover.log
          test -s art/cover_circuit.blend
          test -s client/public/assets/cover_circuit.glb
          ls -lh art/cover_circuit.blend client/public/assets/cover_circuit.glb
      - name: Commit editable Blender layer and in-game GLB
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/cover_circuit.blend client/public/assets/cover_circuit.glb
          if ! git diff --cached --quiet; then
            git commit -m 'Export Cover Circuit C as independent 82-barricade Blender GLB layer'
            git fetch origin arena-v3-cover-layer
            git rebase origin/arena-v3-cover-layer
            git push origin HEAD:arena-v3-cover-layer
          fi
