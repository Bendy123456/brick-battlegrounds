name: FPS Grip Geometry QA
on:
  push:
    branches: [main]
    paths:
      - client/src/engine.ts
      - client/public/assets/weapons/**
      - tests/grip-assets.test.ts
      - art/anatomical_grips.py
      - art/import_authored_weapons.py
      - .github/workflows/quick-grip-geometry-qa.yml
  workflow_dispatch:
jobs:
  grips:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate enlarged nine-gun grips and surface folds
        run: npx vitest run tests/grip-assets.test.ts tests/muzzle-assets.test.ts --reporter=verbose
      - run: npm run check
      - run: npm run build
