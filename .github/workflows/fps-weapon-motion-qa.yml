name: First Person Weapon Motion QA
on:
  push:
    branches: [main]
    paths:
      - client/src/viewmodel-motion.ts
      - client/src/engine.ts
      - tests/viewmodel-motion.test.ts
      - .github/workflows/fps-weapon-motion-qa.yml
  workflow_dispatch:
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx vitest run tests/viewmodel-motion.test.ts --reporter=verbose
      - run: npm run check
      - run: npm run build
