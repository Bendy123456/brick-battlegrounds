name: Build Blender Arena Assets
on:
  push:
    branches: [airsoft-blender-art]
    paths: ['art/build_airsoft.py','.github/workflows/blender-assets.yml']
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender modeling tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --background --python-expr "import numpy; print('Blender glTF NumPy:', numpy.__version__)"
          blender --version
      - name: Model original arena and viewmodel; export GLB plus Blender source
        run: |
          mkdir -p art client/public/assets
          blender --background --python art/build_airsoft.py
          ls -lh art/*.blend client/public/assets/*.glb
      - name: Preserve binary GLBs and editable .blend sources in same Git repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/*.blend client/public/assets/*.glb
          if ! git diff --cached --quiet; then
            git commit -m 'Generate original Blender arena and detailed airsoft viewmodel assets'
            git fetch origin airsoft-blender-art
            git rebase origin/airsoft-blender-art
            git push origin HEAD:airsoft-blender-art
          fi
