name: Build The Arena V2 Blender Game Map
on:
  push:
    branches: [arena-v2-blender-professional]
    paths:
      - 'art/build_arena_v2.py'
      - 'shared/arena-layout.json'
      - '.github/workflows/blender-arena-v2.yml'
permissions:
  contents: write
jobs:
  blender-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender plus glTF texture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build real detailed Blender map with PBR textures
        run: |
          blender --background --python art/build_arena_v2.py > /tmp/arena-v2.log 2>&1 || { tail -130 /tmp/arena-v2.log; exit 1; }
          tail -14 /tmp/arena-v2.log
          grep THE_ARENA_V2_BUILD_SUCCESS /tmp/arena-v2.log
          test -s art/the_arena_v2.blend
          test -s client/public/assets/arena.glb
          ls -lh art/the_arena_v2.blend client/public/assets/arena.glb
      - name: Commit source Blender project and game-ready GLB
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/the_arena_v2.blend client/public/assets/arena.glb
          if ! git diff --cached --quiet; then
            git commit -m 'Generate The Arena V2 detailed Blender warehouse map and game GLB'
            git fetch origin arena-v2-blender-professional
            git rebase origin/arena-v2-blender-professional
            git push origin HEAD:arena-v2-blender-professional
          fi
