name: Quick First-Person Weapon QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/quick-fps-qa.yml
      - client/public/assets/weapons/**
      - tests/authored-weapons.pw.ts
  workflow_dispatch:
jobs:
  viewmodel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/authored-weapons.pw.ts --reporter=line
